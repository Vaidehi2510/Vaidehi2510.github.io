<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaidehi Pandya — Social preview source</title>
  <!-- Render at a 1200 × 630 viewport, device scale factor 1, after fonts and images load. -->
  <style>
    @font-face { font-family: Bricolage; src: url('../assets/fonts/bricolage-grotesque-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
    @font-face { font-family: DM; src: url('../assets/fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { color: #f4edf8; background: #100d18; font-family: DM, sans-serif; }
    main { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 38% 41%, #44305740, transparent 59%), #100d18; }
    .orbit { position: absolute; top: 74px; left: -219px; width: 983px; height: 409px; border: 1px solid #b59acd25; border-radius: 50%; rotate: -32deg; }
    .image { position: absolute; top: 42px; right: 42px; width: 474px; height: 546px; overflow: hidden; }
    .image > img { width: 100%; height: 100%; object-fit: cover; object-position: 55% 50%; }
    .image::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #100d1833, transparent 40%), linear-gradient(0deg, #100d1840, transparent 50%); }
    .inset { position: absolute; right: 24px; bottom: 55px; width: 249px; height: 156px; object-fit: cover; border: 7px solid #100d18; rotate: -5deg; box-shadow: 0 16px 30px #0005; }
    .label { position: absolute; left: 58px; top: 53px; margin: 0; display: flex; align-items: center; gap: 17px; font-size: 13px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase; color: #d1b7ff; }
    .label::before { content: ''; width: 25px; height: 1px; background: #d1b7ff; }
    h1 { position: absolute; left: 49px; top: 139px; margin: 0; z-index: 2; font: 600 142px/.9 Bricolage, sans-serif; letter-spacing: -.068em; color: #d1b7ff; }
    h1 span { display: block; }
    h1 em { display: block; margin-left: 5px; padding-top: 4px; color: #f5bda6; font: italic 400 155px/.94 'Iowan Old Style', Georgia, serif; letter-spacing: -.065em; }
    .statement { position: absolute; left: 60px; top: 452px; margin: 0; font-size: 25px; font-weight: 400; letter-spacing: -.025em; }
    .footer { position: absolute; left: 60px; right: 573px; bottom: 49px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #393142; padding-top: 22px; color: #b9aec8; font-size: 12px; letter-spacing: .025em; }
    .arrow { font-size: 26px; line-height: 1; color: #f5bda6; }
    .star { position: absolute; right: 520px; top: 67px; z-index: 3; font-size: 65px; line-height: 1; color: #f5bda6; rotate: 12deg; }
  </style>
</head>
<body>
  <main aria-label="Vaidehi Pandya. Security Engineering. Curiosity. Practice. Security.">
    <div class="orbit" aria-hidden="true"></div>
    <div class="image"><img src="../assets/projects/patchsentry-cover.jpg" alt="Abstract lavender glass shield enclosing a peach light."></div>
    <img class="inset" src="../assets/projects/aurora-cover.jpg" alt="An illuminated miniature city with connected signals.">
    <p class="label">Security Engineering</p>
    <span class="star" aria-hidden="true">✳</span>
    <h1><span>Vaidehi</span><em>Pandya.</em></h1>
    <p class="statement">Curiosity. Practice. Security.</p>
    <div class="footer"><span>Vaidehi2510.github.io</span><span class="arrow" aria-hidden="true">↗</span></div>
  </main>
</body>
</html>
